<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shlok Shetye</title>

  <!-- Switzer (nav) — Fontshare CDN -->
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@500,400&display=swap" rel="stylesheet" />

  <!-- PP Neue Montreal (hero) — try CDN, local fallback defined below -->
  <link href="https://fonts.cdnfonts.com/css/pp-neue-montreal" rel="stylesheet" />

  <!-- Inter fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <style>
  /* ── LOCAL FONT FALLBACK ───────────────────────────────────────
     If PP Neue Montreal / Switzer are installed locally they load
     instantly; otherwise CDN or Google Fonts kick in.
  ─────────────────────────────────────────────────────────────── */
  @font-face {
    font-family: 'PP Neue Montreal';
    src: local('PPNeueMontreal-Medium'), local('PP Neue Montreal Medium');
    font-weight: 500; font-style: normal;
  }
  @font-face {
    font-family: 'Switzer';
    src: local('Switzer-Medium'), local('Switzer Medium');
    font-weight: 500; font-style: normal;
  }

  /* ── RESET ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  ::-webkit-scrollbar { width: 0; }

  /* ── TOKENS ────────────────────────────────────────────────── */
  :root {
    --bg:        #f2f2f0;    /* Ivan's exact warm near-white */
    --ink:       #0d0d0d;
    --muted:     #999;
    --border:    #e0e0dd;

    --nav-h:     44px;
    --bar-h:     32px;

    /* font stacks */
    --f-nav:  'Switzer', 'Inter', system-ui, sans-serif;
    --f-hero: 'PP Neue Montreal', 'Neue Montreal', 'DM Sans', 'Inter', system-ui, sans-serif;
    --f-ui:   'Switzer', 'Inter', system-ui, sans-serif;
  }

  /* ── BASE ──────────────────────────────────────────────────── */
  body {
    font-family: var(--f-ui);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* ═══════════════════════════════════════════════════════════
     NAV  —  exact Ivan Ageev layout:
     Left half (flex:1): name
     Right half (flex:1, space-between): clock · link · link · link
     → clock lands at exactly 50% of nav width
     Font: Switzer 500, 26px, letter-spacing –0.02em / –0.03em
  ═══════════════════════════════════════════════════════════ */
  .nav {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 400;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* height controlled by nav__row on desktop; JS expands on mobile */
    height: var(--nav-h);
    transition: height 0.48s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Top row — same visual as before */
  .nav__row {
    display: flex;
    align-items: center;
    padding: 0 20px;
    height: var(--nav-h);
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    width: 100%;
  }
  /* When menu is open the border is part of the expanded panel, hide row border */
  .nav.menu-open .nav__row { border-bottom-color: transparent; }

  /* Left column — name */
  .nav__left {
    flex: 1;
    display: flex;
    align-items: center;
  }
  .nav__name {
    font-family: var(--f-nav);
    font-weight: 500;
    font-size: 16px;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  /* Right column — clock + links spread with space-between */
  .nav__right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav__clock {
    font-family: var(--f-nav);
    font-weight: 500;
    font-size: 16px;
    color: var(--ink);
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .nav__link {
    font-family: var(--f-nav);
    font-weight: 400;
    font-size: 16px;
    color: var(--ink);
    text-decoration: none;
    letter-spacing: -0.02em;
    transition: opacity .12s ease;
  }
  .nav__link:hover { opacity: .38; }

  /* ═══════════════════════════════════════════════════════════
     HERO  —  PP Neue Montreal Medium, 17px
     Whitespace: 19vh above (matches Ivan's proportional gap)
                 20vh below (pushes bar near viewport bottom)
  ═══════════════════════════════════════════════════════════ */
  .hero {
    padding-top:    calc(var(--nav-h) + 19vh);
    padding-bottom: calc(20vh + 60px);
    padding-left:   20px;
    padding-right:  20px;
  }

  .hero__text {
    font-family:   var(--f-hero);
    font-weight:   500;           /* Medium */
    font-size:     24px;
    line-height:   1.25;
    color:         var(--ink);
    letter-spacing: -0.01em;
    max-width: 480px;
    opacity: 0;
    filter: blur(10px);
    transform: translateY(8px);
    transition: opacity 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                filter  0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .hero__text.visible {
    opacity: 1;
    filter: blur(0px);
    transform: translateY(0);
  }

  /* ═══════════════════════════════════════════════════════════
     PROJECT BAR  —  sticky below fixed nav
  ═══════════════════════════════════════════════════════════ */
  .bar {
    position: sticky;
    top: var(--nav-h);
    z-index: 300;
    height: var(--bar-h);
    background: var(--bg);
    border-top:    1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
  }

  .bar__meta {
    display: flex;
    align-items: baseline;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
  }
  .bar__meta.split { gap: 0; }
  .bar__meta.split .bar__col { flex: 1; display: flex; align-items: baseline; }

  .bar__name {
    font-family: var(--f-ui);
    font-size: 16px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .bar__sub {
    font-family: var(--f-ui);
    font-size: 16px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  /* ═══════════════════════════════════════════════════════════
     VIEW TOGGLE ICONS  —  exact match to Image #10
     Three filled-rectangle icons: 2-col | 2×2 | 3×3
     Active = var(--ink), inactive = #c8c8c4
  ═══════════════════════════════════════════════════════════ */
  .bar__toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .tbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    padding: 3px;
    cursor: pointer;
    color: #c8c8c4;      /* inactive: light gray */
    transition: color .1s ease;
    line-height: 1;
  }
  .tbtn.on  { color: var(--ink); }
  .tbtn:hover:not(.on) { color: #888; }

  /* ═══════════════════════════════════════════════════════════
     CARD CONTAINERS
  ═══════════════════════════════════════════════════════════ */
  #cards {
    padding: 2px 20px 0;
  }

  .card-full {
    width: 100%;
    height: calc(100vh - var(--nav-h) - var(--bar-h));
  }

  /* 2-up split row (projects 2 & 3) */
  .cards-split {
    display: flex;
    width: 100%;
    gap: 20px;
    align-items: flex-start;
  }
  .card-split {
    flex: 1;
    min-width: 0;
    height: calc(100vh - var(--nav-h) - var(--bar-h));
  }
  .card-split--sm {
    flex: 1;
    min-width: 0;
    height: calc(0.75 * (100vh - var(--nav-h) - var(--bar-h)));
  }

  /* Split sub-bar showing two project metas side by side */
  .sub-bar--split {
    display: flex;
    gap: 20px;
  }
  .sub-bar--split .bar__meta { flex: 1; }
  .cards-double {
    display: flex;
    width: 100%;
    gap: 20px;
  }
  .card-half {
    flex: 1;
    min-width: 0;
    height: calc(100vh - var(--nav-h) - var(--bar-h));
  }

  /* Grid (Ivan asymmetric 60/40) */
  .cards-asym { display: flex; width: 100%; gap: 20px; }
  .card-asym-l {
    width: 60%;
    flex-shrink: 0;
    height: calc(100vh - var(--nav-h) - var(--bar-h));
  }
  .card-asym-r {
    flex: 1;
    height: calc(100vh - var(--nav-h) - var(--bar-h));
  }

  .sub-bar {
    height: var(--bar-h);
    background: var(--bg);
    border-top:    1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    margin-top: 40px;
  }

  /* ── Depth AI card ─────────────────────────────────────── */
  .depth-card {
    width: 100%; height: 100%;
    background: #0d0d0d url('protfolio thumbnails/Screenshot 2026-03-31 143457.png') center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .depth-card__video {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .3s ease;
    pointer-events: none;
  }
  .depth-card:hover .depth-card__video {
    opacity: 1;
  }
  .depth-logo { display: flex; align-items: center; gap: 18px; user-select: none; }
  .depth-word {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    color: #868686;
    letter-spacing: 0.08em;
    line-height: 1;
  }
  .depth-word--lg { font-size: 62px; }
  .depth-word--md { font-size: 34px; }
  .depth-word--sm { font-size: 26px; }

  /* ── Zero Health card ──────────────────────────────────── */
  .zero-card {
    width: 100%; height: 100%;
    background: #fff;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    position: relative;
  }
  .zero-card__phone {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 245px;
    height: 442px;
    overflow: hidden;
    pointer-events: none;
  }
  .zero-card__phone img {
    position: absolute;
    top: -1.06%;
    left: 0;
    width: 97.44%;
    height: 101.95%;
    object-fit: cover;
    display: block;
  }

  /* ── Focus card ────────────────────────────────────────── */
  .focus-card {
    width: 100%; height: 100%;
    background: #f9f9f9;
    overflow: hidden;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .focus-card img,
  .focus-card video {
    position: absolute;
    width: 75%;
    height: 75%;
    object-fit: contain;
    pointer-events: none;
  }
  .fc-timer {
    font-family: 'Inter', sans-serif;
    font-size: 52px; font-weight: 300;
    color: #2a2a2a; letter-spacing: -0.02em; line-height: 1;
  }
  .fc-colon { opacity: .7; }
  .fc-controls {
    display: flex; align-items: center; gap: 10px;
  }
  .fc-btn-reset {
    background: #fff;
    border-radius: 999px;
    padding: 7px 18px;
    font-family: 'Inter', sans-serif;
    font-size: 12px; color: #333;
    box-shadow: 0 1px 4px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.06);
  }
  .fc-toggle {
    width: 44px; height: 24px;
    background: #d8d6d4; border-radius: 999px;
    position: relative;
  }
  .fc-toggle-knob {
    position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .fc-device {
    width: 100%;
    background: #2e2e2e;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.2);
  }
  .fc-screen {
    background: #0a0a0a;
    margin: 8px 8px 0;
    border-radius: 12px 12px 0 0;
    height: 200px;
    position: relative;
    display: flex; align-items: flex-end;
    padding: 12px 14px;
    justify-content: space-between;
  }
  .fc-brand {
    position: absolute; top: 10px; right: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 8px; color: rgba(255,255,255,.2);
    letter-spacing: 0.12em;
  }
  .fc-nodes {
    display: flex; align-items: baseline; gap: 5px;
  }
  .fc-n {
    font-family: 'Inter', sans-serif;
    font-size: 22px; font-weight: 300; color: rgba(255,255,255,.65);
  }
  .fc-nl {
    font-family: 'Inter', sans-serif;
    font-size: 11px; color: rgba(255,255,255,.3);
  }
  .fc-hint {
    font-family: 'Inter', sans-serif;
    font-size: 9px; color: rgba(255,255,255,.25);
    letter-spacing: 0.08em;
  }
  .fc-dock {
    display: flex; align-items: center;
    padding: 10px 14px; gap: 0;
    justify-content: space-between;
  }
  .fc-auto {
    font-family: 'Inter', sans-serif;
    font-size: 10px; color: rgba(255,255,255,.45);
    letter-spacing: 0.06em; display: flex; align-items: center; gap: 5px;
  }
  .fc-dot, .fc-dot2 {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.35);
  }
  .fc-dot2 { background: rgba(255,255,255,.5); }
  .fc-vol-icon, .fc-trash-icon {
    font-size: 13px; color: rgba(255,255,255,.4);
  }
  .fc-pills {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  }
  .fc-pill {
    background: #1f1f1f;
    border-radius: 999px;
    padding: 6px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 11px; color: rgba(255,255,255,.6);
  }
  .fc-pill--on { background: #111; color: rgba(255,255,255,.9); }
  .fc-mood {
    width: 100%;
    background: #1a1a1a;
    border-radius: 12px;
    padding: 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 12px; color: rgba(255,255,255,.25);
  }

  /* ── Zero Hero card (project 4) ───────────────────────── */
  .zerohero-card {
    width: 100%; height: 100%;
    background: url('file:///C:/Users/Shlok/Downloads/Frame 2085664471.png') center / cover no-repeat;
  }

  /* ── Portfolio pill — animated confirm-button style ────── */
  /* outer wrapper: fixed position + drop-shadow */
  .pill-wrap {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    border-radius: 999px;
    box-shadow: 0 3px 14px 0 #BFBFBF;
  }
  .pill-wrap:active { transform: translateX(-50%) scale(.97); }

  /* external moving glow — drifts organically, NOT clipped */
  .pill-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 80px;
    height: 80px;
    margin: -40px 0 0 -40px;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(220, 230, 218, 1) 0%,
      rgba(220, 230, 218, 0.4) 45%,
      transparent 72%
    );
    filter: blur(14px);
    animation: pill-drift 6s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes pill-drift {
    0%   { transform: translate(  0px,   0px); }
    10%  { transform: translate( 32px,  -4px); }
    22%  { transform: translate( 18px,   8px); }
    35%  { transform: translate(-10px,   6px); }
    48%  { transform: translate(-34px,  -2px); }
    60%  { transform: translate(-22px, -10px); }
    72%  { transform: translate(  8px, -12px); }
    85%  { transform: translate( 28px,   4px); }
    100% { transform: translate(  0px,   0px); }
  }

  /* clip layer — 1.5px padding creates the "border" zone where comet shows */
  .pill-clip {
    position: relative;
    z-index: 1;
    display: inline-flex;
    border-radius: 999px;
    overflow: hidden;
    padding: 1.5px;
    background: #E3E3E3; /* base border color, comet overwrites it */
  }
  /* comet: a sharp bright arc that traces the border ring */
  .pill-frame {
    position: absolute;
    inset: -200%;
    background: conic-gradient(
      from 0deg,
      transparent       0deg,
      transparent     330deg,
      rgba(190,205,188, 0.45) 346deg,
      rgba(220,230,218, 0.85) 354deg,
      rgba(255,255,255, 1   ) 358deg,
      rgba(220,230,218, 0.85) 360deg,
      transparent       360deg
    );
    animation: pill-comet 2.2s linear infinite;
    pointer-events: none;
  }
  @keyframes pill-comet {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  /* the actual anchor — sits on top, white bg hides center of comet */
  .pill {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: #fff;
    border: none;
    padding: 11.5px 36.5px; /* compensates for 1.5px clip padding */
    cursor: pointer;
    text-decoration: none;
    font-family: var(--f-nav);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: .025em;
    white-space: nowrap;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  /* label: #5E6D70 with linear gradient mask */
  .pill-label {
    display: block;
    color: #5E6D70;
    -webkit-mask-image: linear-gradient(
      90deg,
      rgba(0,0,0,0.5) 0%,
      #000 22%,
      #000 78%,
      rgba(0,0,0,0.5) 100%
    );
    mask-image: linear-gradient(
      90deg,
      rgba(0,0,0,0.5) 0%,
      #000 22%,
      #000 78%,
      rgba(0,0,0,0.5) 100%
    );
  }

  /* ═══════════════════════════════════════════════════════════
     HAMBURGER BUTTON
  ═══════════════════════════════════════════════════════════ */
  .nav__burger {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    width: 28px;
    height: 28px;
    padding: 0;
    position: relative;
    flex-shrink: 0;
  }
  .burger__line {
    display: block;
    position: absolute;
    left: 4px; right: 4px;
    height: 1.5px;
    background: var(--ink);
    border-radius: 1px;
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1),
                top     0.35s cubic-bezier(0.4,0,0.2,1),
                bottom  0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .burger__line--t { top: 9px; }
  .burger__line--b { bottom: 9px; }
  .nav__burger.open .burger__line--t { top: calc(50% - 0.75px); transform: rotate(45deg); }
  .nav__burger.open .burger__line--b { bottom: calc(50% - 0.75px); transform: rotate(-45deg); }

  /* ═══════════════════════════════════════════════════════════
     MOBILE EXPANDED MENU PANEL
  ═══════════════════════════════════════════════════════════ */
  .nav__mob {
    display: none;
    flex-direction: column;
    justify-content: flex-start;
    flex: 1 0 0;
    padding: 24px 20px 48px;
    gap: 2px;
    border-top: 1px solid var(--border);
  }
  .nav__mob-link {
    font-family:     var(--f-hero);
    font-weight:     500;
    font-size:       30px;
    line-height:     1.2em;
    letter-spacing:  -0.02em;
    color:           var(--ink);
    text-decoration: none;
    padding:         7px 0;
    opacity:         0;
    transform:       translateY(10px);
    transition:      opacity 0.38s ease, transform 0.38s ease, color 0.12s ease;
  }
  .nav__mob-link:hover { color: var(--muted); }
  /* Stagger in when menu opens */
  .nav.menu-open .nav__mob-link:nth-child(1) { opacity:1; transform:none; transition-delay:.07s; }
  .nav.menu-open .nav__mob-link:nth-child(2) { opacity:1; transform:none; transition-delay:.13s; }
  .nav.menu-open .nav__mob-link:nth-child(3) { opacity:1; transform:none; transition-delay:.19s; }

  /* ═══════════════════════════════════════════════════════════
     MOBILE  —  ≤ 640px
  ═══════════════════════════════════════════════════════════ */
  @media (max-width: 640px) {

    /* Nav row */
    .nav__row { padding: 0 14px; }
    .nav__name { font-size: 14px; }
    /* Hide desktop items, show burger */
    .nav__clock { display: none; }
    .nav__link  { display: none; }
    .nav__burger { display: flex; align-items: center; justify-content: center; }
    .nav__right { justify-content: flex-end; }
    /* Show mobile panel */
    .nav__mob { display: flex; }
    /* Nav open → full screen */
    .nav.menu-open { height: 100dvh; height: 100vh; }
    /* Lock scroll when open */
    body.nav-open { overflow: hidden; }

    /* Hero */
    .hero {
      padding-top:    calc(var(--nav-h) + 8vh);
      padding-bottom: calc(8vh + 32px);
      padding-left:   14px;
      padding-right:  14px;
    }
    .hero__text { font-size: 19px; max-width: 100%; }

    /* Bar */
    .bar { padding: 0 14px; }
    .bar__toggle { display: none; }
    .bar__name, .bar__sub { font-size: 13px; }

    /* Cards wrapper */
    #cards { padding: 2px 0 0; }

    /* Force every multi-column layout to stack */
    .cards-split,
    .cards-double,
    .cards-asym { flex-direction: column; gap: 0; }

    /* All card variants → full-width */
    .card-full,
    .card-split,
    .card-split--sm,
    .card-half,

<!-- ── JS ──────────────────────────────────────────────────── -->
<script>
const PROJECTS = [
  { id:'depth', name:'Depth Ai',    sub:'\u00a0,\u00a0Fitness,\u00a02025\u00a0+' },
  { id:'zero',  name:'Zero Health', sub:'\u00a0,\u00a0Health\u00a0\u00b7\u00a0AI,\u00a02026\u00a0+' },
  { id:'focus', name:'Focus',    sub:'\u00a0,\u00a0Productivity,\u00a02025\u00a0+' },
  { id:'zerohero', name:'Zero Health', sub:'\u00a0,\u00a0Health\u00a0\u00b7\u00a0AI,\u00a02026\u00a0+' },
]

/* hero blur reveal */
window.addEventListener('load', function () {
  setTimeout(function () {
    var hero = document.querySelector('.hero__text');
    if (hero) hero.classList.add('visible');
  }, 120);
});

/* clock */
;(function tick(){
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-IN',{
      timeZone:'Asia/Kolkata',hour12:false,
      hour:'2-digit',minute:'2-digit',second:'2-digit'
    })+' IST'
  setTimeout(tick,1000)
})()

/* helpers */
const $c = id => document.getElementById(id).content.cloneNode(true)

function metaNode(p){
  const d=document.createElement('div'); d.className='bar__meta'
  d.innerHTML=`<span class="bar__name">${p.name}</span><span class="bar__sub">${p.sub}</span>`
  return d
}
function cardContent(projectIndex){
  const p=PROJECTS[projectIndex]
  const w=document.createElement('div')
  if(p && p.id==='depth'){
    w.className='depth-card'
    const vid=document.createElement('video')
    vid.className='depth-card__video'
    vid.src='../Recording 2026-03-31 145330.mp4'
    vid.muted=true
    vid.loop=true
    vid.playsInline=true
    const playVid=()=>vid.play()
    const stopVid=()=>{ vid.pause(); vid.currentTime=0 }
    w.addEventListener('mouseenter', playVid)
    w.addEventListener('mouseleave', stopVid)
    w.addEventListener('touchstart', playVid, {passive:true})
    w.addEventListener('touchend',   stopVid, {passive:true})
    w.appendChild(vid)
  } else if(p && p.id==='zero'){
    w.className='zero-card'
    w.style.cursor='pointer'
    w.addEventListener('click',()=>location.href='zero-health.html')
    const wrap=document.createElement('div'); wrap.className='zero-card__phone'
    const img=document.createElement('img')
    img.src='https://www.figma.com/api/mcp/asset/efaa703e-d189-42fc-a9e0-d2f1145a9147'
    img.alt='Zero Health'
    wrap.appendChild(img); w.appendChild(wrap)
  } else if(p && p.id==='focus'){
    w.className='focus-card'
    w.style.cursor='pointer'
    w.addEventListener('click',()=>location.href='focus.html')
    const img=document.createElement('img')
    img.src='https://www.figma.com/api/mcp/asset/ce884105-bac0-45c4-aaeb-084afaec3bc4'
    img.alt='Focus'
    img.style.cssText='opacity:1;'
    const vid=document.createElement('video')
    vid.src='../Recording 2026-04-07 191043.mp4'
    vid.muted=true; vid.loop=true; vid.playsInline=true; vid.playbackRate=2
    vid.style.cssText='opacity:0;transition:opacity .3s ease;'
    const playFocus=()=>{ vid.playbackRate=2; vid.play(); vid.style.opacity=1 }
    const stopFocus=()=>{ vid.pause(); vid.currentTime=0; vid.style.opacity=0 }
    w.addEventListener('mouseenter', playFocus)
    w.addEventListener('mouseleave', stopFocus)
    w.addEventListener('touchstart', playFocus, {passive:true})
    w.addEventListener('touchend',   stopFocus, {passive:true})
    w.appendChild(img)
    w.appendChild(vid)
  } else if(p && p.id==='zerohero'){
    w.className='zerohero-card'
  } else {
    w.style.cssText='width:100%;height:100%;background:#000;'
  }
  return w
}

/* scroll-based sticky bar updater */
let scrollCleanup=null
function setupScrollSections(sections){
  if(scrollCleanup){scrollCleanup();scrollCleanup=null}
  function setBar(s){
    const bm=document.getElementById('barMeta')
    bm.innerHTML=''
    if(Array.isArray(s.projects)){
      bm.className='bar__meta split'
      s.projects.forEach(pi=>{
        const col=document.createElement('div');col.className='bar__col'
        col.appendChild(metaNode(PROJECTS[pi]));bm.appendChild(col)
      })
    } else {
      bm.className='bar__meta'
      bm.appendChild(metaNode(PROJECTS[s.projects]))
    }
  }
  function onScroll(){
    const barBottom=document.querySelector('.bar').getBoundingClientRect().bottom
    let active=0
    for(let i=1;i<sections.length;i++){
      if(sections[i].trigger.getBoundingClientRect().top<=barBottom+1) active=i
    }
    setBar(sections[active])
  }
  window.addEventListener('scroll',onScroll,{passive:true})
  onScroll()
  scrollCleanup=()=>window.removeEventListener('scroll',onScroll)
}

/* render */
let cur='s'
function sv(v){
  if(cur===v) return; cur=v
  ;['s','d','g'].forEach(k=>{
    document.getElementById('btn-'+k).classList.toggle('on',k===v)
  })
  render()
}

function render(){
  /* bar */
  const bm=document.getElementById('barMeta')
  bm.innerHTML=''
  if(cur==='d'){
    bm.className='bar__meta split'
    ;[0,1].forEach(i=>{
      const col=document.createElement('div'); col.className='bar__col'
      col.appendChild(metaNode(PROJECTS[i])); bm.appendChild(col)
    })
  } else {
    bm.className='bar__meta'
    bm.appendChild(metaNode(PROJECTS[0]))
  }

  /* cards */
  const cards=document.getElementById('cards')
  cards.innerHTML=''

  if(cur==='s'){
    // Project 1 — full width (main bar already shows its meta)
    const c1=document.createElement('div'); c1.className='card-full card-link'
    c1.style.cursor='pointer'
    c1.addEventListener('click',()=>location.href='depth-ai.html')
    c1.appendChild(cardContent(0)); cards.appendChild(c1)

    // Projects 2 & 3 — split sub-bar + side-by-side cards
    const sb23=document.createElement('div'); sb23.className='sub-bar sub-bar--split'; sb23.style.marginTop='40px'
    const m2=metaNode(PROJECTS[1]); const m3=metaNode(PROJECTS[2])
    sb23.appendChild(m2); sb23.appendChild(m3); cards.appendChild(sb23)
    const row=document.createElement('div'); row.className='cards-split'
    const c2=document.createElement('div'); c2.className='card-split'; c2.appendChild(cardContent(1)); row.appendChild(c2)
    const c3=document.createElement('div'); c3.className='card-split--sm'; c3.appendChild(cardContent(2)); row.appendChild(c3)
    cards.appendChild(row)

    // Project 4 — full width
    const sb4=document.createElement('div'); sb4.className='sub-bar'; sb4.style.marginTop='40px'
    sb4.appendChild(metaNode(PROJECTS[3])); cards.appendChild(sb4)
    const c4=document.createElement('div'); c4.className='card-full'; c4.appendChild(cardContent(3)); cards.appendChild(c4)

    // scroll tracker: update sticky bar as sections pass
    setupScrollSections([
      {trigger:c1,   projects:0},
      {trigger:sb23, projects:[1,2]},
      {trigger:sb4,  projects:3},
    ])
  }
  else if(cur==='d'){
    if(scrollCleanup){scrollCleanup();scrollCleanup=null}
    // Row 1: projects 0 & 1
    const row1=document.createElement('div'); row1.className='cards-double'
    ;[0,1].forEach(i=>{const c=document.createElement('div');c.className='card-half';if(i===0){c.style.cursor='pointer';c.addEventListener('click',()=>location.href='depth-ai.html')}c.appendChild(cardContent(i));row1.appendChild(c)})
    cards.appendChild(row1)
    // Row 2: projects 2 & 3
    const sb2=document.createElement('div'); sb2.className='sub-bar sub-bar--split'; sb2.style.marginTop='40px'
    sb2.appendChild(metaNode(PROJECTS[2])); sb2.appendChild(metaNode(PROJECTS[3])); cards.appendChild(sb2)
    const row2=document.createElement('div'); row2.className='cards-double'
    ;[2,3].forEach(i=>{const c=document.createElement('div');c.className='card-half';c.appendChild(cardContent(i));row2.appendChild(c)})
    cards.appendChild(row2)
    setupScrollSections([
      {trigger:row1, projects:[0,1]},
      {trigger:sb2,  projects:[2,3]},
    ])
  }
  else if(cur==='g'){
    if(scrollCleanup){scrollCleanup();scrollCleanup=null}
    // Row 1: asymmetric 60/40
    const row1=document.createElement('div'); row1.className='cards-asym'
    const big=document.createElement('div'); big.className='card-asym-l'; big.style.cursor='pointer'; big.addEventListener('click',()=>location.href='depth-ai.html'); big.appendChild(cardContent(0)); row1.appendChild(big)
    const sm=document.createElement('div'); sm.className='card-asym-r'; sm.appendChild(cardContent(1)); row1.appendChild(sm)
    cards.appendChild(row1)
    // Row 2: asymmetric 60/40 (flipped)
    const sb2=document.createElement('div'); sb2.className='sub-bar sub-bar--split'; sb2.style.marginTop='40px'
    sb2.appendChild(metaNode(PROJECTS[2])); sb2.appendChild(metaNode(PROJECTS[3])); cards.appendChild(sb2)
    const row2=document.createElement('div'); row2.className='cards-asym'
    const sm2=document.createElement('div'); sm2.className='card-asym-r'; sm2.appendChild(cardContent(2)); row2.appendChild(sm2)
    const big2=document.createElement('div'); big2.className='card-asym-l'; big2.appendChild(cardContent(3)); row2.appendChild(big2)
    cards.appendChild(row2)
    setupScrollSections([
      {trigger:row1, projects:[0,1]},
      {trigger:sb2,  projects:[2,3]},
    ])
  }
}
render()

/* ── mobile menu toggle ─────────────────────────────────── */
;(function(){
  var btn  = document.getElementById('menuBtn')
  var nav  = document.getElementById('siteNav')
  if(!btn) return
  btn.addEventListener('click', function(){
    var open = nav.classList.toggle('menu-open')
    btn.classList.toggle('open', open)
    document.body.classList.toggle('nav-open', open)
  })
  // close on link tap
  nav.querySelectorAll('.nav__mob-link').forEach(function(a){
    a.addEventListener('click', function(){
      nav.classList.remove('menu-open')
      btn.classList.remove('open')
      document.body.classList.remove('nav-open')
    })
  })
})()
</script>
</body>
